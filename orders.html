<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Qaseh Katering Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="orders">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <header id="topbar"></header>
    <div class="content">

      <div class="page-head">
        <div><div class="ph-t" data-en="Orders" data-bm="Tempahan">Orders</div><div class="ph-s" id="ph-sub" data-en="Manage all catering bookings" data-bm="Urus semua tempahan katering">Manage all catering bookings</div></div>
        <div class="grow"></div>
        <button class="btn btn-primary" id="new-order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-en="New order" data-bm="Tempahan baharu">New order</span></button>
      </div>

      <!-- KPI strip -->
      <section class="stat-strip" id="order-stats"></section>

      <!-- Toolbar -->
      <section class="card pad" style="padding:14px 16px">
        <div class="toolbar">
          <label class="field search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="q" data-en="Search order, customer, venue…" data-bm="Cari tempahan, pelanggan, lokasi…" data-i18n-ph placeholder="Search order, customer, venue…">
          </label>
          <div class="select"><select id="f-status">
            <option value="" data-en="All statuses" data-bm="Semua status">All statuses</option>
            <option value="confirmed" data-en="Confirmed" data-bm="Disahkan">Confirmed</option>
            <option value="preparing" data-en="Preparing" data-bm="Sedang sedia">Preparing</option>
            <option value="completed" data-en="Completed" data-bm="Selesai">Completed</option>
            <option value="pending" data-en="Pending" data-bm="Menunggu">Pending</option>
            <option value="cancelled" data-en="Cancelled" data-bm="Dibatalkan">Cancelled</option>
          </select></div>
          <div class="select"><select id="f-pkg"><option value="" data-en="All packages" data-bm="Semua pakej">All packages</option></select></div>
          <div class="select"><select id="f-pay">
            <option value="" data-en="All payments" data-bm="Semua bayaran">All payments</option>
            <option value="paid" data-en="Paid" data-bm="Dibayar">Paid</option>
            <option value="partial" data-en="Partial" data-bm="Separa">Partial</option>
            <option value="unpaid" data-en="Unpaid" data-bm="Belum bayar">Unpaid</option>
            <option value="refunded" data-en="Refunded" data-bm="Dipulangkan">Refunded</option>
          </select></div>
          <label class="field date-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><input type="date" id="f-date"></label>
          <span class="grow"></span>
          <span class="result-count" id="rc"></span>
        </div>
      </section>

      <!-- Table -->
      <section class="card tbl-card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th data-en="Order" data-bm="Tempahan">Order</th><th data-en="Customer" data-bm="Pelanggan">Customer</th><th data-en="Event" data-bm="Majlis">Event</th><th data-en="Date" data-bm="Tarikh">Date</th>
              <th class="r">Pax</th><th class="r" data-en="Amount" data-bm="Jumlah">Amount</th><th data-en="Status" data-bm="Status">Status</th><th data-en="Payment" data-bm="Bayaran">Payment</th>
            </tr></thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </section>

    </div>
  </main>
</div>
<div class="tt" id="tooltip"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/orders.js"></script>
</body>
</html>
